<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yousuf & Arwa | Engagement</title>
<meta property="og:title" content="Yousuf & Arwa - Engagement Invitation">
<meta property="og:description" content="We fall in love in October. 16 October 2026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cormorant+Garamond:wght@400;600&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#2a0f1c;
    --bg2:#12070e;
    --gold:#f2c879;
    --gold2:#ffe5b0;
    --rose:#ff7a9c;
    --cream:#fff4e3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 30%, var(--bg1) 0%, var(--bg2) 75%);
    color:var(--cream);
    font-family:'Cormorant Garamond', Georgia, serif;
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
  }

  /* twinkling background stars */
  #bgimg{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.2s;
    background-position:center;background-size:cover;background-repeat:no-repeat;
  }
  #bgimg.on{opacity:1}
  #sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .layer{position:absolute;inset:-50px;transition:transform .25s ease-out;will-change:transform}
  #glow{
    position:fixed;left:0;top:0;width:260px;height:260px;border-radius:50%;pointer-events:none;z-index:2;
    opacity:0;transition:opacity .4s;will-change:transform;
    background:radial-gradient(circle,rgba(255,160,190,.28),rgba(242,200,121,.12) 40%,transparent 70%);
  }
  .tw{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.2;
      animation:twinkle var(--d,3s) ease-in-out infinite;animation-delay:var(--dl,0s)}
  @keyframes twinkle{0%,100%{opacity:.1;transform:scale(.8)}50%{opacity:.9;transform:scale(1.4)}}

  /* falling leaves */
  .leaf{position:fixed;top:-40px;font-size:var(--s,18px);pointer-events:none;z-index:1;opacity:.75;
        animation:fall var(--t,14s) linear forwards}
  @keyframes fall{
    0%{transform:translate3d(0,-40px,0) rotate(0)}
    100%{transform:translate3d(var(--dx,60px),110vh,0) rotate(540deg)}
  }

  /* ---------- intro star ---------- */
  #intro{
    position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;cursor:pointer;
    transition:opacity .8s ease;
  }
  #intro.gone{opacity:0;pointer-events:none}
  #starWrap{width:min(62vw,300px);aspect-ratio:1;position:relative;
            animation:bob 3s ease-in-out infinite}
  #starWrap svg{width:100%;height:100%;overflow:visible;
                filter:drop-shadow(0 0 18px rgba(242,200,121,.75))}
  @keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.04)}}
  .petal{transform-origin:0 0}
  .petal polygon{fill:url(#gold);stroke:#fff1c9;stroke-width:1;stroke-linejoin:round}
  #intro.open #starWrap{animation:none}
  #intro.open .petal polygon{animation:petalOut 1.3s cubic-bezier(.5,0,.3,1) forwards}
  @keyframes petalOut{
    0%{transform:translateY(0) scale(1);opacity:1}
    35%{transform:translateY(-18px) scale(1.05);opacity:1}
    100%{transform:translateY(-230px) scale(.6) rotate(25deg);opacity:0}
  }
  #core{fill:#fff6da;opacity:0;transform-origin:0 0}
  #intro.open #core{animation:coreGlow 1.3s ease forwards}
  @keyframes coreGlow{0%{opacity:.2;transform:scale(.4)}40%{opacity:1;transform:scale(3.2)}100%{opacity:0;transform:scale(9)}}
  #bism{
    font-family:'Amiri','Traditional Arabic',serif;font-weight:700;direction:rtl;
    font-size:clamp(1.9rem,8vw,2.8rem);color:var(--gold2);text-align:center;line-height:1.5;
    margin-bottom:28px;padding:0 16px;text-shadow:0 0 18px rgba(242,200,121,.6);
    transition:opacity .4s;
  }
  #intro.open #bism{opacity:0}
  #hint{
    margin-top:34px;font-size:1.25rem;letter-spacing:.25em;text-transform:uppercase;
    color:var(--gold2);animation:pulse 2s ease-in-out infinite;text-align:center;padding:0 20px;
  }
  #intro.open #hint{opacity:0;transition:opacity .3s;animation:none}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* ---------- curtains + lantern ---------- */
  #intro.open{pointer-events:none}
  #intro > #bism,#intro > #lanternSvg,#intro > #hint{position:relative;z-index:2}
  .cur{
    position:absolute;top:0;bottom:0;width:50.5%;z-index:0;
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.30) 0 6px,rgba(255,255,255,.06) 6px 14px,rgba(0,0,0,0) 14px 38px),
      linear-gradient(180deg,#7a1230,#4a0a1e 70%,#33071a);
    box-shadow:inset 0 0 70px rgba(0,0,0,.55);
    transition:transform 1.5s cubic-bezier(.65,0,.2,1) .9s;
  }
  .cl{left:0;border-right:2px solid var(--gold)}
  .cr{right:0;border-left:2px solid var(--gold)}
  #intro.open .cl{transform:translateX(-102%)}
  #intro.open .cr{transform:translateX(102%)}
  .rod{
    position:absolute;top:0;left:0;right:0;height:12px;z-index:1;
    background:linear-gradient(#ffe5b0,#f2c879 60%,#b27a2b);box-shadow:0 4px 12px rgba(0,0,0,.5);
    transition:transform .8s ease 1.7s;
  }
  #intro.open .rod{transform:translateY(-120%)}

  #lanternSvg{width:min(52vw,220px);height:auto;overflow:visible;animation:hang 3s ease-in-out infinite}
  @keyframes hang{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
  .halo{opacity:.2;transition:opacity .7s}
  .dim{opacity:.55;transition:opacity .6s}
  .flame{transform-origin:100px 263px;animation:flameS .3s ease-in-out infinite alternate}
  @keyframes flameS{from{transform:scale(.45,.5)}to{transform:scale(.55,.62)}}
  @keyframes flameB{from{transform:scale(1,1)}to{transform:scale(1.15,1.35)}}
  #intro.open .halo{opacity:1}
  #intro.open .dim{opacity:0}
  #intro.open .flame{animation:flameB .2s ease-in-out infinite alternate}
  #intro.open #lanternSvg{animation:lift 2.6s cubic-bezier(.4,0,.6,1) .5s forwards}
  @keyframes lift{
    0%{transform:translateY(0) rotate(0)}
    15%{transform:translateY(8px) rotate(-1.5deg)}
    100%{transform:translateY(-130vh) rotate(3deg)}
  }

  /* floating lanterns (moved by JS so they react to touch) */
  .fl{
    position:fixed;left:0;top:0;z-index:1;pointer-events:none;
    width:var(--w,30px);height:calc(var(--w,30px) * 1.3);
    border-radius:46% 46% 38% 38% / 55% 55% 30% 30%;
    background:radial-gradient(ellipse at 50% 70%,#fff3c4 0%,#ffc45a 45%,#ff8a2a 100%);
    box-shadow:0 0 18px 6px rgba(255,170,70,.5),0 0 50px 14px rgba(255,140,60,.22);
    opacity:0;will-change:transform,opacity,filter;
  }
  .fl::after{content:"";position:absolute;left:25%;right:25%;bottom:-3px;height:4px;background:#5a2a10;border-radius:2px}

  /* ---------- invitation ---------- */
  #card{
    position:relative;z-index:3;min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;padding:28px 16px;
    opacity:0;transform:scale(.6);pointer-events:none;
  }
  #card.show{animation:cardIn 1.4s cubic-bezier(.2,.9,.3,1) .5s forwards;pointer-events:auto}
  @keyframes cardIn{
    0%{opacity:0;transform:scale(.4)}
    100%{opacity:1;transform:scale(1)}
  }
  .frame{
    width:min(94vw,560px);text-align:center;padding:44px 26px 38px;
    border:1px solid rgba(242,200,121,.55);border-radius:22px;
    background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 0 60px rgba(255,122,156,.18), inset 0 0 40px rgba(242,200,121,.06);
    position:relative;
  }
  .frame::before{
    content:"";position:absolute;inset:8px;border:1px dashed rgba(242,200,121,.28);border-radius:16px;pointer-events:none
  }
  .small{letter-spacing:.38em;text-transform:uppercase;font-size:.9rem;color:var(--gold)}
  .names{
    font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(2.6rem,11vw,4rem);line-height:1.2;
    letter-spacing:.03em;margin:16px 0 6px;
    background:linear-gradient(90deg,var(--gold2),var(--rose),var(--gold2));
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 5s linear infinite;
  }
  @keyframes shine{to{background-position:200% center}}
  .amp{display:block;font-size:.55em;color:var(--gold);-webkit-text-fill-color:var(--gold)}
  .tagline{
    font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(1.6rem,6.5vw,2.1rem);color:var(--rose);margin:10px 0 18px
  }
  .divider{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--gold);margin:14px 0}
  .divider::before,.divider::after{content:"";height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold))}
  .divider::after{transform:scaleX(-1)}
  .date{font-size:1.5rem;font-weight:600;letter-spacing:.12em;color:var(--cream)}
  .sub{margin-top:6px;font-size:1.1rem;opacity:.85}

  #count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px auto 4px;max-width:420px}
  .box{
    padding:14px 4px 10px;border-radius:14px;border:1px solid rgba(242,200,121,.4);
    background:rgba(0,0,0,.28);
  }
  .box b{display:block;font-size:clamp(1.7rem,8vw,2.4rem);font-weight:600;color:var(--gold2);
         font-variant-numeric:tabular-nums;line-height:1.1}
  .box span{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
  .honor{margin-top:22px;font-size:1.35rem;font-style:italic;color:var(--gold2);letter-spacing:.04em}
  .loc{
    display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:12px 26px;
    border:1px solid var(--gold);border-radius:999px;color:var(--gold2);text-decoration:none;
    font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;
    background:rgba(242,200,121,.08);transition:background .25s,transform .25s;
  }
  .loc:hover,.loc:active{background:rgba(242,200,121,.22);transform:translateY(-2px)}
  #done{display:none;font-family:'Great Vibes',cursive;font-size:2.4rem;color:var(--gold2);margin-top:22px}

  /* ---------- hearts ---------- */
  .heart{
    position:fixed;z-index:3;pointer-events:none;line-height:1;
    color:var(--c,#ff5d8f);font-size:var(--s,14px);
    text-shadow:0 0 8px var(--c,#ff5d8f);
    animation:heartUp var(--t,2.6s) ease-out forwards;
  }
  @keyframes heartUp{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
    15%{opacity:1}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% - var(--dy,90px))) scale(1.15) rotate(var(--r,0deg))}
  }

  /* music button */
  #sound{
    position:fixed;right:16px;bottom:16px;z-index:10;width:48px;height:48px;border-radius:50%;
    border:1px solid rgba(242,200,121,.7);background:rgba(0,0,0,.45);color:var(--gold2);
    font-size:1.4rem;cursor:pointer;display:none;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  #sound.on{display:flex}
  #sound.muted{opacity:.6}

  @media (prefers-reduced-motion:reduce){
    .leaf,.names{animation:none}
  }
</style>
</head>
<body>

<div id="bgimg"></div>
<div id="sky"></div>
<div id="glow"></div>

<!-- Intro: tap the star -->
<div id="intro">
  <div id="bism">بسم الله نبدأ حكايتنا</div>
  <div class="rod"></div>
  <div class="cur cl"></div>
  <div class="cur cr"></div>

  <svg id="lanternSvg" viewBox="0 0 200 290" aria-label="Tap to light the lantern">
    <defs>
      <radialGradient id="lg" cx="50%" cy="65%" r="60%">
        <stop offset="0" stop-color="#fff6cf"/>
        <stop offset=".45" stop-color="#ffc45a"/>
        <stop offset="1" stop-color="#ff8a2a"/>
      </radialGradient>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ffbe5a" stop-opacity=".7"/>
        <stop offset="1" stop-color="#ffbe5a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="rib" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffd27a"/>
        <stop offset="1" stop-color="#ff7a9c"/>
      </linearGradient>
    </defs>
    <circle class="halo" cx="100" cy="175" r="135" fill="url(#halo)"/>
    <path d="M100 46 C88 66 112 82 100 106" stroke="url(#rib)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M58 160 C58 126 76 104 100 104 C124 104 142 126 142 160 L128 232 L72 232 Z" fill="url(#lg)" stroke="#ffd98f" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M100 104 L100 232 M80 108 C72 150 74 200 76 232 M120 108 C128 150 126 200 124 232" stroke="#963c14" stroke-opacity=".35" stroke-width="1.5" fill="none"/>
    <path d="M100 196 C84 184 88 170 95 170 C98 170 100 173 100 173 C100 173 102 170 105 170 C112 170 116 184 100 196 Z" fill="#a03220" fill-opacity=".55"/>
    <path class="dim" d="M58 160 C58 126 76 104 100 104 C124 104 142 126 142 160 L128 232 L72 232 Z" fill="#1a0a10"/>
    <rect x="70" y="232" width="60" height="7" rx="3" fill="#5a2a10"/>
    <ellipse class="flame" cx="100" cy="250" rx="7" ry="13" fill="#fff0a8"/>
    <g class="bow">
      <path d="M100 26 C74 0 54 30 100 30 Z" fill="#ff7a9c"/>
      <path d="M100 26 C126 0 146 30 100 30 Z" fill="#ff7a9c"/>
      <path d="M100 30 L86 54 L96 50 L100 58 Z" fill="#ffb3c6"/>
      <path d="M100 30 L114 54 L104 50 L100 58 Z" fill="#ffb3c6"/>
      <circle cx="100" cy="28" r="6" fill="#ffd27a"/>
    </g>
  </svg>
  <div id="hint">Tap to light the lantern</div>
</div>

<!-- Invitation -->
<main id="card">
  <div class="frame">
    <div class="small">You are invited to the engagement of</div>
    <h1 class="names">Yousuf <span class="amp">&</span> Arwa</h1>
    <div class="tagline">We fall in love in October</div>

    <div class="divider">&#10084;</div>

    <div class="date">16 · OCTOBER · 2026</div>
    <div class="sub">Join us to celebrate our engagement</div>

    <div id="count">
      <div class="box"><b id="d">00</b><span>Days</span></div>
      <div class="box"><b id="h">00</b><span>Hours</span></div>
      <div class="box"><b id="m">00</b><span>Minutes</span></div>
      <div class="box"><b id="s">00</b><span>Seconds</span></div>
    </div>
    <div id="done">Today is the day! &#10084;</div>

    <div class="honor">We would be honored by your presence</div>

    <!-- Location: replace 30.0444,31.2357 with your coordinates (latitude,longitude) -->
    <a class="loc" href="https://www.google.com/maps?q=30.0444,31.2357" target="_blank" rel="noopener">&#128205; Location</a>
  </div>
</main>

<!-- Put your song next to this file and name it music.mp3 -->
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>
<button id="sound" aria-label="Toggle music" title="Music">&#9835;</button>

<script>
(function(){
  /* ====== EDIT HERE: event date & time (year, month 0-11, day, hour, minute) ====== */
  var TARGET = new Date(2026, 9, 16, 19, 0, 0);   // 16 Oct 2026 - 7:00 PM
  /* ================================================================================ */

  /* optional background picture: upload a file named background.jpg next to index.html */
  var bgReady = false, bgShown = false;
  function showBg(){          // called when the user taps: the picture fades in only after the tap
    bgShown = true;
    if (bgReady) document.getElementById('bgimg').classList.add('on');
  }
  (function(){
    var url = 'background.jpg';
    var im = new Image();
    im.onload = function(){
      var b = document.getElementById('bgimg');
      b.style.backgroundImage = 'linear-gradient(rgba(18,7,14,.40),rgba(18,7,14,.62)), url("' + url + '")';
      bgReady = true;
      if (bgShown) b.classList.add('on');
    };
    im.src = url;   // if the file does not exist nothing changes
  })();

  /* background stars */
  var sky = document.getElementById('sky');
  var layerEls = [10, 22, 40].map(function(d){
    var l = document.createElement('div');
    l.className = 'layer';
    l.dataset.depth = d;
    sky.appendChild(l);
    return l;
  });
  for (var i = 0; i < 100; i++){
    var li = i % 3;                      // closer layers = bigger stars, move more
    var t = document.createElement('div');
    t.className = 'tw';
    t.style.left = Math.random()*100 + '%';
    t.style.top  = Math.random()*100 + '%';
    t.style.width = t.style.height = (2 + li) + 'px';
    t.style.setProperty('--d', (2 + Math.random()*4) + 's');
    t.style.setProperty('--dl', (Math.random()*4) + 's');
    layerEls[li].appendChild(t);
  }

  /* falling autumn leaves */
  var leaves = ['\uD83C\uDF42','\uD83C\uDF41'];
  function spawnLeaf(){
    var l = document.createElement('div');
    l.className = 'leaf';
    l.textContent = leaves[Math.floor(Math.random()*leaves.length)];
    l.style.left = Math.random()*100 + 'vw';
    l.style.setProperty('--s', (14 + Math.random()*14) + 'px');
    l.style.setProperty('--t', (10 + Math.random()*8) + 's');
    l.style.setProperty('--dx', (-80 + Math.random()*160) + 'px');
    document.body.appendChild(l);
    setTimeout(function(){ l.remove(); }, 19000);
  }
  setInterval(spawnLeaf, 1800);
  spawnLeaf();

  /* countdown */
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function tick(){
    var diff = TARGET - new Date();
    if (diff <= 0){
      document.getElementById('count').style.display = 'none';
      document.getElementById('done').style.display = 'block';
      return;
    }
    var s = Math.floor(diff/1000);
    var d = Math.floor(s/86400); s -= d*86400;
    var h = Math.floor(s/3600);  s -= h*3600;
    var m = Math.floor(s/60);    s -= m*60;
    document.getElementById('d').textContent = pad(d);
    document.getElementById('h').textContent = pad(h);
    document.getElementById('m').textContent = pad(m);
    document.getElementById('s').textContent = pad(s);
  }
  tick(); setInterval(tick, 1000);

  /* hearts */
  var colors = ['#ff5d8f','#ff7a9c','#ff3d6e','#ffa0b8','#f2c879','#ff8fb1'];
  var heartCount = 0;
  function heart(x, y, ch, col, size){
    if (heartCount > 200) return;
    heartCount++;
    var h = document.createElement('div');
    h.className = 'heart';
    h.textContent = ch || '\u2665';
    h.style.left = x + 'px';
    h.style.top  = y + 'px';
    h.style.setProperty('--c', col || colors[Math.floor(Math.random()*colors.length)]);
    h.style.setProperty('--s', (size || (10 + Math.random()*14)) + 'px');
    h.style.setProperty('--t', (2.2 + Math.random()*1.6) + 's');
    h.style.setProperty('--dx', (-30 + Math.random()*60) + 'px');
    h.style.setProperty('--dy', (70 + Math.random()*90) + 'px');
    h.style.setProperty('--r', (-30 + Math.random()*60) + 'deg');
    document.body.appendChild(h);
    setTimeout(function(){ h.remove(); heartCount--; }, 4000);
  }

  var W = window.innerWidth, H = window.innerHeight;
  window.addEventListener('resize', function(){ W = innerWidth; H = innerHeight; });

  /* pointer position (updated by the pointermove handler below) */
  var ptX = -9999, ptY = -9999, ptAt = 0;
  window.addEventListener('pointerup', function(e){ if (e.pointerType !== 'mouse') ptX = -9999; });
  document.documentElement.addEventListener('pointerleave', function(){ ptX = -9999; });

  /* ---------- interactive lanterns ---------- */
  var lanterns = [];
  var MAX_LANTERNS = 26;
  function lanternTarget(){ return W < 600 ? 9 : 14; }

  function spawnLantern(x, y, wish){
    if (lanterns.length >= MAX_LANTERNS) return null;
    var w = wish ? 22 + Math.random()*10 : 20 + Math.random()*28;
    var el = document.createElement('div');
    el.className = 'fl';
    el.style.setProperty('--w', w + 'px');
    document.body.appendChild(el);
    var rise = 0.45 + Math.random()*0.5;
    var L = {
      el: el, w: w, h: w*1.3,
      x: (x === undefined) ? Math.random()*W : x,
      y: (y === undefined) ? H + 40 + Math.random()*120 : y,
      vx: 0, vy: wish ? -2.2 : -rise,
      rise: rise, ph: Math.random()*6.28,
      born: performance.now(), state: 0, pt: 0, hot: 0
    };
    lanterns.push(L);
    return L;
  }

  function lanternAt(x, y){
    var best = null, bd = 1e9;
    for (var i = 0; i < lanterns.length; i++){
      var L = lanterns[i];
      if (L.state) continue;
      var d = Math.hypot(x - L.x, y - L.y);
      if (d < Math.max(L.w*0.95, 28) + 8 && d < bd){ bd = d; best = L; }
    }
    return best;
  }

  /* push lanterns away from a point (and make them glow) */
  function shockwave(x, y, R, k){
    R = R || 220; k = k || 3.2;
    for (var i = 0; i < lanterns.length; i++){
      var L = lanterns[i];
      if (L.state) continue;
      var dx = L.x - x, dy = L.y - y, d = Math.hypot(dx, dy) || 1;
      if (d < R){
        var f = (1 - d/R) * k;
        L.vx += dx/d*f; L.vy += dy/d*f - f*0.5; L.hot = 1;
      }
    }
  }

  /* tapping a lantern pops it into hearts and sparkles */
  function popLantern(L){
    L.state = 1; L.pt = 0;
    for (var i = 0; i < 9; i++){
      (function(k){
        setTimeout(function(){
          heart(L.x + Math.random()*30 - 15, L.y + Math.random()*30 - 15);
          if (k % 2) heart(L.x, L.y, '✦', '#ffe5b0', 10 + Math.random()*10);
        }, k*45);
      })(i);
    }
    shockwave(L.x, L.y, 150, 1.8);
  }

  var lastT = performance.now(), lastMaint = 0;
  function lanternLoop(now){
    var dt = Math.min(2, (now - lastT)/16.67); lastT = now;
    var active = ptX > -9000 && (now - ptAt) < 4000;
    for (var i = lanterns.length - 1; i >= 0; i--){
      var L = lanterns[i];

      if (L.state === 1){                       // popping
        L.pt += dt;
        var k = L.pt/16;
        if (k >= 1){ L.el.remove(); lanterns.splice(i, 1); continue; }
        L.el.style.opacity = (1 - k).toFixed(3);
        L.el.style.filter = 'brightness(' + (1.3 + k).toFixed(2) + ')';
        L.el.style.transform = 'translate3d(' + (L.x - L.w/2).toFixed(1) + 'px,' + (L.y - L.h/2).toFixed(1) + 'px,0) scale(' + (1 + k*1.1).toFixed(3) + ')';
        continue;
      }

      if (active){                              // finger / mouse gently pushes lanterns away
        var dx = L.x - ptX, dy = L.y - ptY, d = Math.hypot(dx, dy) || 1, R = 130;
        if (d < R){
          var f = (1 - d/R) * 0.55 * dt;
          L.vx += dx/d*f; L.vy += dy/d*f;
          L.hot = Math.min(1, L.hot + .08*dt);
        }
      }

      L.ph += .02*dt;                           // sway, then settle back to the gentle rise
      L.vx += Math.sin(L.ph)*.012*dt;
      L.vx *= Math.pow(.97, dt);
      L.vy += (-L.rise - L.vy)*.025*dt;
      L.x += L.vx*dt; L.y += L.vy*dt;
      if (L.x < -30) L.x = W + 30; else if (L.x > W + 30) L.x = -30;
      L.hot = Math.max(0, L.hot - .012*dt);
      if (L.y < -L.h - 40){ L.el.remove(); lanterns.splice(i, 1); continue; }

      var age    = Math.min(1, (now - L.born)/900);
      var top    = Math.min(1, Math.max(0, (L.y + 40)/160));
      var bottom = Math.min(1, Math.max(0, (H + 60 - L.y)/90));
      var flick  = 1 + Math.sin(now/230 + L.ph*3)*.08 + L.hot*.35;
      var sc     = 1 + L.hot*.14;
      L.el.style.opacity = (0.92*age*top*bottom).toFixed(3);
      L.el.style.filter = 'brightness(' + flick.toFixed(3) + ')';
      L.el.style.transform = 'translate3d(' + (L.x - L.w/2).toFixed(1) + 'px,' + (L.y - L.h/2).toFixed(1) + 'px,0) rotate(' + (L.vx*5).toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
    }
    if (now - lastMaint > 1000){
      lastMaint = now;
      if (lanterns.length < lanternTarget()) spawnLantern();
    }
    requestAnimationFrame(lanternLoop);
  }

  var lanternsOn = false;
  function startLanterns(){
    if (lanternsOn) return; lanternsOn = true;
    var n = lanternTarget();
    for (var i = 0; i < n; i++) spawnLantern(Math.random()*W, H*(0.15 + Math.random()*0.8));
    lastT = performance.now();
    requestAnimationFrame(lanternLoop);
  }

  /* open the star */
  var intro = document.getElementById('intro');
  var card  = document.getElementById('card');
  var opened = false, openedAt = 0;
  function openStar(){
    if (opened) return; opened = true; openedAt = Date.now();
    intro.classList.add('open');
    // burst of hearts from the center
    var cx = W/2, cy = H/2;
    for (var i = 0; i < 18; i++){ (function(k){ setTimeout(function(){ heart(cx + (Math.random()*60-30), cy + (Math.random()*60-30)); }, k*50); })(i); }
    card.classList.add('show');
    showBg();
    setTimeout(function(){ intro.classList.add('gone'); }, 3300);
    setTimeout(startLanterns, 1200);
    startMusic();
  }
  intro.addEventListener('click', openStar);

  /* interactive background: glow follows the pointer, stars shift (parallax), sparkle trail */
  var glow = document.getElementById('glow');
  var lastSpark = 0;
  window.addEventListener('pointermove', function(e){
    var x = e.clientX, y = e.clientY;
    ptX = x; ptY = y; ptAt = performance.now();
    glow.style.opacity = 1;
    glow.style.transform = 'translate3d(' + (x-130) + 'px,' + (y-130) + 'px,0)';
    var nx = x/W - .5, ny = y/H - .5;
    for (var i = 0; i < layerEls.length; i++){
      var d = +layerEls[i].dataset.depth;
      layerEls[i].style.transform = 'translate3d(' + (-nx*d) + 'px,' + (-ny*d) + 'px,0)';
    }
    var now = performance.now();
    if (opened && now - lastSpark > 90){
      lastSpark = now;
      heart(x, y, '\u2726', '#ffe5b0', 8 + Math.random()*8);
    }
  });

  /* tap / click: pop a lantern if you hit one, otherwise hearts + a shockwave + a new wish lantern */
  document.addEventListener('click', function(e){
    if (!opened || Date.now() - openedAt < 900) return;
    if (e.target.closest && e.target.closest('a,button')) return;
    var x = e.clientX, y = e.clientY;
    var hit = lanternAt(x, y);
    if (hit){ popLantern(hit); return; }
    for (var i = 0; i < 12; i++){
      (function(k){
        setTimeout(function(){
          heart(x + Math.random()*40 - 20, y + Math.random()*40 - 20);
          if (k % 2) heart(x, y, '✦', '#f2c879', 10 + Math.random()*10);
        }, k*40);
      })(i);
    }
    shockwave(x, y);
    spawnLantern(x, y, true);
  });

  /* music: starts on the tap (browsers block autoplay without one) */
  var bgm = document.getElementById('bgm');
  var soundBtn = document.getElementById('sound');
  var MAX_VOL = 1.0;   // full volume (0 to 1)
  function fadeIn(){
    var v = 0; bgm.volume = 0;
    var iv = setInterval(function(){
      v += .05;
      if (v >= MAX_VOL){ bgm.volume = MAX_VOL; clearInterval(iv); }
      else bgm.volume = v;
    }, 100);
  }
  function startMusic(){
    var p = bgm.play();
    if (p && p.then){
      p.then(function(){ fadeIn(); }).catch(function(){});
    }
    soundBtn.classList.add('on');
  }
  soundBtn.addEventListener('click', function(){
    if (bgm.paused){ bgm.play(); bgm.volume = MAX_VOL; soundBtn.classList.remove('muted'); }
    else { bgm.pause(); soundBtn.classList.add('muted'); }
  });
})();
</script>
</body>
</html>
